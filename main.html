<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anika Sabrine - Creative Portfolio & Blog</title>
    <meta name="description" content="Anika Sabrine - Creative professional showcasing illustrations, animations, photography, fashion design, and creative writing." />
    <link rel="stylesheet" href="styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Roboto:wght@300;400;500&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container">
                <h1 class="logo">Anika Sabrine</h1>
                <ul class="nav-links">
                    <li><a href="#portfolio">Portfolio</a></li>
                    <li><a href="#blog">Blog</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </div>
        </nav>
    </header>
    <main>
        <section id="portfolio" class="portfolio">
            <h2 class="section-title">Portfolio</h2>
            <ul class="portfolio-list" id="portfolioList">
                <!-- Portfolio list items dynamically rendered here -->
            </ul>
        </section>

        <section id="blog" class="blog">
            <h2 class="section-title">Blog</h2>
            <div id="blogList">
                <!-- Blog posts dynamically rendered here -->
            </div>
        </section>

        <section id="about" class="about">
            <h2 class="section-title">About Me</h2>
            <p>I am Anika Sabrine, a creative professional passionate about telling stories through art, animation, photography, and design...</p>
        </section>

        <section id="contact" class="contact">
            <h2 class="section-title">Contact Me</h2>
            <form id="contactForm">
                <label for="name">Name</label><br />
                <input type="text" id="name" name="name" required /><br />
                <label for="email">Email</label><br />
                <input type="email" id="email" name="email" required /><br />
                <label for="message">Message</label><br />
                <textarea id="message" name="message" rows="5" required></textarea><br />
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Anika Sabrine. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
