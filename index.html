<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Anika Sabrine</title>
    <link href="https://fonts.googleapis.com/css2?family=Didot&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Didot', serif;
            background: linear-gradient(135deg, #dff7f4, #fbe9e7);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            color: #114B23;
        }
        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        button {
            margin-top: 2rem;
            padding: 1rem 2rem;
            font-size: 1.25rem;
            background-color: #114B23;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #0e3a1b;
        }
    </style>
    <script>
        function redirectToMain() {
            window.location.href = 'main.html';
        }
        setTimeout(redirectToMain, 5000);
    </script>
</head>
<body>
    <div class="container">
        <h1>Welcome to Anika Sabrine</h1>
        <p>Your journey into creativity begins here.</p>
        <button onclick="redirectToMain()">Enter Site</button>
    </div>
</body>
</html>
